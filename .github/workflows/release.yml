name: Release CLI
on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Match release tag to package version
        run: node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("packages/cli/package.json")); if (process.env.GITHUB_REF_NAME !== `cli-v${p.version}`) throw new Error("Tag and package version differ");'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run api:check
      - run: npm run plugin:check
      - run: npm run evals:check
      - run: npm run smoke:mcp
      - run: npm run spec:check
      - run: npm publish --workspace @wildpi/cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
